<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Checkout</title>
  <script src="../js/main.js" type="module"></script>
  <script type="module" src="../js/checkout.js"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <header class="divider" id="main-header">

  </header>

  <main class="divider">
    <section class="products">
      <h2>Review & Place your Order</h2>

      <form id="checkout-form">
        <fieldset>
          <legend>Customer Information</legend>
          <label for="fname">First Name:</label>
          <input type="text" id="fname" name="fname" required />

          <label for="lname">Last Name:</label>
          <input type="text" id="lname" name="lname" required />

          <label for="street">Address:</label>
          <input type="text" id="street" name="street" required />

          <label for="city">City:</label>
          <input type="text" id="city" name="city" required />

          <label for="state">State:</label>
          <input type="text" id="state" name="state" required />

          <label for="zip">Zip Code:</label>
          <input type="text" id="zip" name="zip" required />
        </fieldset>
        <fieldset>
          <legend>Payment Information</legend>
          <label for="cardNumber">Card Number:</label>
          <input type="text" id="cardNumber" name="cardNumber" required />

          <label for="expiration">Expiration Date:</label>
          <input type="text" id="expiration" name="expiration" placeholder="MM/YY" pattern="(0[1-9]|1[0-2])\/[0-9]{2}" title="Use MM/YY format, like 12/27" required />

          <label for="code">CVV:</label>
          <input type="text" id="code" name="code" required />

        </fieldset>

        <fieldset class="checkout-summary">
          <legend>Order Summary</legend>

          <div class="order__summary">
            <div>Items</div>
            <div id="num-items"></div>
            <div>Subtotal</div>
            <div id="cartTotal"></div>
            <div>Tax</div>
            <div id="tax"></div>
            <div>Shipping</div>
            <div id="shipping"></div>
            <div>Total</div>
            <div id="orderTotal"></div>
          </div>
        </fieldset>

        <button type="submit">Checkout</button>
      </form>
    </section>
  </main>

  <footer id="main-footer">&copy;NOT a real business</footer>
  <script type="module">
    import { updateCartCount } from "../js/utils.mjs";

    updateCartCount();
  </script>
</body>

</html>
