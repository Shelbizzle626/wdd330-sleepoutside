<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Checkout</title>
  <script src="../js/main.js" type="module"></script>
  <script type="module" src="../js/checkout.js"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <header class="divider" id="main-header">

  </header>

  <main class="divider">
    <section class="products">
      <h2>Review & Place your Order</h2>

      <form id="checkout-form">
        <fieldset>
          <legend>Customer Information</legend>
          <label for="fname">First Name:</label>
          <input
            type="text"
            id="fname"
            name="fname"
            autocomplete="given-name"
            required
          />

          <label for="lname">Last Name:</label>
          <input
            type="text"
            id="lname"
            name="lname"
            autocomplete="family-name"
            required
          />

          <label for="street">Street Address:</label>
          <input
            type="text"
            id="street"
            name="street"
            autocomplete="street-address"
            required
          />

          <label for="city">City:</label>
          <input
            type="text"
            id="city"
            name="city"
            autocomplete="address-level2"
            required
          />

          <label for="state">State:</label>
          <input
            type="text"
            id="state"
            name="state"
            autocomplete="address-level1"
            minlength="2"
            maxlength="2"
            pattern="[A-Za-z]{2}"
            title="2-letter state code"
            required
          />

          <label for="zip">Zip Code:</label>
          <input
            type="text"
            id="zip"
            name="zip"
            autocomplete="postal-code"
            pattern="[0-9]{5}(-[0-9]{4})?"
            title="5-digit zip code"
            required
          />
        </fieldset>
        <fieldset>
          <legend>Payment Information</legend>
          <label for="cardNumber">Card Number:</label>
          <input
            type="text"
            id="cardNumber"
            name="cardNumber"
            inputmode="numeric"
            pattern="[0-9]{16}"
            title="16-digit card number"
            autocomplete="cc-number"
            required
          />

          <label for="expiration">Expiration Date:</label>
          <input
            type="text"
            id="expiration"
            name="expiration"
            placeholder="MM/YY"
            pattern="(0[1-9]|1[0-2])\/[0-9]{2}"
            title="Use MM/YY format, like 12/27"
            autocomplete="cc-exp"
            required
          />

          <label for="code">Security Code:</label>
          <input
            type="text"
            id="code"
            name="code"
            inputmode="numeric"
            pattern="[0-9]{3,4}"
            title="3 or 4 digit CVV"
            autocomplete="cc-csc"
            required
          />

        </fieldset>

        <fieldset class="checkout-summary">
          <legend>Order Summary</legend>

          <div class="order__summary">
            <div>Items</div>
            <div id="num-items"></div>
            <div>Subtotal</div>
            <div id="cartTotal"></div>
            <div>Tax</div>
            <div id="tax"></div>
            <div>Shipping</div>
            <div id="shipping"></div>
            <div>Total</div>
            <div id="orderTotal"></div>
          </div>
        </fieldset>

        <button type="submit">Checkout</button>
      </form>
    </section>
  </main>

  <footer id="main-footer">&copy;NOT a real business</footer>
  <script type="module">
    import { updateCartCount } from "../js/utils.mjs";

    updateCartCount();
  </script>
</body>

</html>
