<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <div class="hero">
        <img
          src="/images/banner-sm.jpg"
          srcset="images/banner-sm.jpg 500w, images/banner.jpg"
          alt="image of a high mountain lake"
        />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>

      <section class="categories">
        <h2>Shop by Category</h2>

        <ul class="product-grid">
          <li>
            <a href="/product_listing/index.html?category=tents">
              <img src="/images/product_icons/tents.svg" alt="" />
              <span>Tents</span>
            </a>
          </li>
          <li>
            <a href="/product_listing/index.html?category=backpacks">
              <img src="/images/product_icons/backpacks.svg" alt="" />
              <span>Backpacks</span>
            </a>
          </li>
          <li>
            <a href="/product_listing/index.html?category=sleeping-bags">
              <img src="/images/product_icons/sleepingbags.svg" alt="" />
              <span>Sleeping Bags</span>
            </a>
          </li>
          <li>
            <a href="/product_listing/index.html?category=hammocks">
              <img src="/images/product_icons/hammocks.svg" alt="" />
              <span>Hammocks</span>
            </a>
          </li>
        </ul>
      </section>

      <section class="newsletter">
        <h2>Join Our Newsletter</h2>
        <p>Get news about new products and special deals.</p>
        <form id="newsletter-form">
          <label for="newsletter-email">Email</label>
          <input
            type="email"
            id="newsletter-email"
            name="email"
            placeholder="you@example.com"
            required
          />
          <button type="submit">Subscribe</button>
        </form>
        <p id="newsletter-message" class="newsletter-message" hidden></p>
      </section>
    </main>
    <footer id="main-footer"></footer>

    <script type="module">
      import { updateCartCount } from "/js/utils.mjs";

      document.addEventListener("DOMContentLoaded", () => {
        updateCartCount();
      });
    </script>
  </body>
</html>
